name: Update clouds

on:
  schedule:
    - cron: '17 */3 * * *'   # 3時間ごと(UTC)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install numpy pillow quicktex netCDF4 scipy
      - name: Fetch GMGSI and build hybrid clouds
        run: python make_clouds.py --polar
      # --- him/match patch ---
      - name: Fix 93E satellite seam with Himawari (skips itself on failure)
        run: |
          cp clouds_src.png /tmp/clouds_src_raw.png
          python himawari_seam.py clouds_src.png clouds_src.png --nc gmgsi_lw.nc --zmax 88 --latmax 66 --lattaper 4 --cache /tmp/himawari
      - name: Match cloud look to built-in clouds
        run: python cloud_match.py clouds_src.png clouds_src.png || echo "::warning::cloud_match failed - raw clouds used"
      # --- him/match patch end ---
      - name: Generate cubemap tiles
        run: |
          DATE=$(date -u +%Y%m%d_%H%M)
          python clouds_pipeline.py clouds_src.png . "$DATE"
          python check_seams.py --tiles "$DATE"
          python check_faces_diag.py --tiles "$DATE" || echo "::warning::斜め線の疑いあり($DATE) - labels に追加して確認すること"
          python -c "import json; json.dump({'baseUrl':'https://hdhsksdhsk.github.io/pixel-clouds/'+'$DATE'+'/'}, open('root.json','w'))"
      - name: Archive inputs (for reproduction)
        uses: actions/upload-artifact@v4
        with:
          name: inputs-${{ github.run_id }}
          path: |
            gmgsi_lw.nc
            clouds_src.png
            polar_K.npy
            /tmp/clouds_src_raw.png
          retention-days: 14
          if-no-files-found: warn
      - name: Prune old date dirs (keep latest 4)
        run: ls -d 20*_* 2>/dev/null | sort | head -n -4 | xargs -r rm -rf
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Auto update clouds (GMGSI) $(date -u +%Y-%m-%d_%H:%M)" || echo "no changes"
          git push
